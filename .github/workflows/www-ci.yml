name: www-ci
on:
  push:
    branches: [main, phase-0-foundation]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint:dc
      - run: npm test
      - run: npm run build
      - run: npm run size-check
